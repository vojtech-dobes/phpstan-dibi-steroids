name: checks

on:
  - push

env:
  COMPOSER_NO_INTERACTION: "1"

jobs:
  format:
    name: Code style

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --ansi --no-progress --prefer-dist

      - name: Run PHP_Codesniffer
        run: vendor/bin/phpcs

  static_analysis:
    name: Static analysis

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --ansi --no-progress --prefer-dist

      - name: Run parallel-lint
        run: composer run lint

      - name: Run PHPStan
        run: composer run phpstan

  tests:
    name: PHP ${{ matrix.php }} tests on ${{ matrix.os }} with ${{ matrix.deps }} deps

    needs:
      - static_analysis

    strategy:
      matrix:
        deps:
          - stable
          - lowest
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        php:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'

        exclude:
          - deps: lowest
            os: macos-latest

          - deps: lowest
            os: windows-latest

      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo, pdo_mysql, pdo_sqlite

      - run: composer install --ansi --no-progress --prefer-dist

      - run: composer update --ansi --no-progress --prefer-lowest
        if: matrix.deps == 'lowest'

      - name: Run tests
        run: composer run test-without-db

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          path: tests/output

  db_tests:
    name: PHP tests with database

    needs:
      - tests

    strategy:
      fail-fast: false

    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:24.0.7
        options: --privileged

    steps:
      - uses: actions/checkout@v4

      - run: docker compose up --wait

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo, pdo_mysql, pdo_sqlite

      - run: composer install --ansi --no-progress --prefer-dist

      - name: Run tests
        run: composer run test-with-db

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          path: tests/output
